name: CD

# Push da main: reusa o ci.yml -> build+push da imagem web -> deploy via Terraform (stg).
# NEXT_PUBLIC_* são assados na IMAGEM (build-arg) — build-time. CLERK_SECRET_KEY é runtime
# (vai na variable collection do TF, NÃO na imagem). Push da imagem ANTES do deploy.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build & push web
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push web (NEXT_PUBLIC_* em build-arg → baked na imagem)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jus-fe-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/jus-fe-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (terraform apply)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}   # = Autojus
      TF_WORKSPACE: autojus-terraform-fe
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}          # court-legal 0f0790a9 (default no _env.sh)
      ENVIRONMENT_ID: ${{ vars.ENVIRONMENT_ID }}                  # env production 04d181f3 (default no _env.sh)
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: terraform apply (converge-loop, IMAGE_TAG=sha)
        run: bash infra/terraform/apply.sh
